version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: mlops-demo

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python --version
      - make install
  pre_build:
    commands:
      - make format-check
      - make lint
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_URI=$REGISTRY/$IMAGE_REPO_NAME
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REGISTRY
  build:
    commands:
      - make test-ci
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG -t $REPOSITORY_URI:latest .
  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
          docker push $REPOSITORY_URI:$IMAGE_TAG && docker push $REPOSITORY_URI:latest
        else
          echo "Build failed, skipping image push"
        fi

reports:
  pytest-reports:
    files:
      - test-results.xml
    file-format: JUNITXML
