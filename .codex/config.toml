# Project-level Codex config. User-level settings (model, provider, auth) stay in ~/.codex/config.toml.
# Codex reads this file only for trusted projects.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

[agents]
enabled = true
max_concurrent_threads_per_session = 3
